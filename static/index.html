<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Iris 품종 예측</title>
</head>
<body>
  <h3>Iris 측정값 넷을 넣으면 품종을 답합니다</h3>
  <label>꽃받침 길이 <input id="sl" value="6.0"></label>
  <label>꽃받침 너비 <input id="sw" value="2.9"></label>
  <label>꽃잎 길이 <input id="pl" value="4.5"></label>
  <label>꽃잎 너비 <input id="pw" value="1.5"></label>
  <button id="go">예측</button>
  <p id="result"></p>
  <script>
    document.getElementById("go").onclick = async () => {
      const body = {
        sepal_length: +sl.value, sepal_width: +sw.value,
        petal_length: +pl.value, petal_width: +pw.value,
      };
      const r = await fetch("/api/iris/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body),
      });
      const data = await r.json();
      result.textContent = data.species + " (" + data.probability + ")";
    };
  </script>
</body>
</html>
